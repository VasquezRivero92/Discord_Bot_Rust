# Stack autónomo de MachuPeek: Web y Bot nativo (Rust) + Túnel Cloudflare.
# 100% independiente de cualquier otro proyecto o contenedor legado.
#
# Uso:
#   docker compose up -d

services:
  # 1. Frente de entrada de alta velocidad + Bot de Discord integrado (Rust / Axum + Serenity)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: machupeek-web:fase1
    container_name: machupeek-web
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "15633"
      STATIC_DIR: /srv/public
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-sa.json
      CS2_SSH_KEY_PATH: /app/clave_cs2.pem
    ports:
      # Puerto local para entrar como http://localhost:15633
      - "127.0.0.1:15633:15633"
    networks:
      default:
        aliases:
          - discord-faceit-bot
          - web
    volumes:
      - type: bind
        source: ./public
        target: /srv/public
        read_only: true
      # Única parte escribible de /srv/public: las imágenes que suben los jugadores al chat.
      # Requiere que exista ./public/uploads en el host (mkdir -p public/uploads): public/ se
      # monta en solo lectura y Docker no puede crear el punto de montaje por su cuenta.
      - type: volume
        source: machupeek-uploads
        target: /srv/public/uploads
      - type: bind
        source: ./firebase-service-account.json
        target: /run/secrets/firebase-sa.json
        read_only: true
      - type: bind
        source: ./clave_cs2.pem
        target: /app/clave_cs2.pem
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # 2. Túnel oficial de Cloudflare Zero Trust para machupeek.com
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: machupeek-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # El token NUNCA va escrito en el repositorio ni en .env (compose pasa .env entero al
      # contenedor web). cloudflared lo lee de un archivo montado en solo lectura, así tampoco
      # aparece en `docker inspect`. Guárdalo en ./secrets/tunnel-token (carpeta ignorada por git)
      # o apunta TUNNEL_TOKEN_PATH a otro archivo. Ver docs/despliegue-docker.md.
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    volumes:
      - type: bind
        source: ${TUNNEL_TOKEN_PATH:-./secrets/tunnel-token}
        target: /run/secrets/tunnel-token
        read_only: true
        bind:
          # Si el archivo no existe, falla con un error claro en vez de crear una carpeta vacía.
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy

volumes:
  # Imágenes subidas al chat del Mixton (/uploads/chat/*). Persisten entre reinicios y
  # actualizaciones de la imagen; el resto del contenedor es de solo lectura.
  machupeek-uploads:
