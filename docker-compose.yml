# Stack autónomo de MachuPeek: Web y Bot nativo (Rust) + Túnel Cloudflare.
# 100% independiente de cualquier otro proyecto o contenedor legado.
#
# Uso:
#   docker compose up -d

services:
  # 1. Frente de entrada de alta velocidad + Bot de Discord integrado (Rust / Axum + Serenity)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: machupeek-web:fase1
    container_name: machupeek-web
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "15633"
      STATIC_DIR: /srv/public
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-sa.json
      CS2_SSH_KEY_PATH: /app/clave_cs2.pem
    ports:
      # Puerto local para entrar como http://localhost:15633
      - "127.0.0.1:15633:15633"
    networks:
      default:
        aliases:
          - discord-faceit-bot
          - web
    volumes:
      - type: bind
        source: ./public
        target: /srv/public
        read_only: true
      - type: bind
        source: ./firebase-service-account.json
        target: /run/secrets/firebase-sa.json
        read_only: true
      - type: bind
        source: ./clave_cs2.pem
        target: /app/clave_cs2.pem
        read_only: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # 2. Túnel oficial de Cloudflare Zero Trust para machupeek.com
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: machupeek-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-eyJhIjoiOGJkNGE0MzkwMzJhNWY1Zjg4MDgyYWZhMTU5NTAzMTYiLCJ0IjoiYmVjODFhNjUtOGQ5OC00YjQ5LWEwZjgtODQyYzQ2YWRiM2FmIiwicyI6Ik1qZG1aVEF3TXpjdFkyUTJPQzAwTVRrNExUZ3dZekF0TWpneU1qZ3hOek00WTJJNCJ9}
    depends_on:
      web:
        condition: service_healthy
