# Panel de administracion (/api/admin/*), Tarea 6: respuestas de `requireAuth`
# (`verifyAdminToken`, middleware/auth.js). En la Tarea 6 Rust aun no atiende ninguna
# ruta de /api/admin (todas pasan por el proxy); estos casos fijan el contrato que las
# rutas de las Tareas 7 y 8 deben conservar. Las tokens firmadas usan --jwt-secret.

[[case]]
name = "admin claims sin cookie"
path = "/api/admin/claims"
expect_status = 401

[[case]]
name = "admin logs sin cookie"
path = "/api/admin/logs"
expect_status = 401

[[case]]
name = "admin settings sin cookie"
path = "/api/admin/settings"
expect_status = 401

[[case]]
name = "admin claims con token invalido"
path = "/api/admin/claims"
headers = { Cookie = "auth_token=valor-de-prueba" }
expect_status = 401

[[case]]
name = "admin claims con usuario sin permisos"
path = "/api/admin/claims"
expect_status = 403

[case.cookie_jwt]
user_id = "1"
username = "contraste-usuario"
is_admin = false
role = "usuario"
