# Tarea 8: lecturas derivadas (stats, users/backup, yape/transactions). Rust las atiende solo
# con Firestore configurado. /settings, /stats/:nickname y /matches/:id/demo siguen en Node
# (API de Faceit / estado de Node): sus casos comparan Node con Node a traves del proxy.

# Cada lado tiene su statsCache de 60 s (por servidor): puede diferir si un usuario se vincula
# por Discord o cambian los ajustes entre las dos lecturas.
[[case]]
name = "admin stats global"
path = "/api/admin/stats"
expect_status = 200

[case.cookie_jwt]
user_id = "1"
username = "contraste-admin"
is_admin = false
role = "global_admin"

# Mismo aviso de cache (clave por servidor).
[[case]]
