[workspace]
resolver = "2"
members = ["crates/common", "crates/data", "crates/web", "crates/contrast", "crates/cs2", "crates/lobby", "crates/bot"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
thiserror = "2"
dotenvy = "0.15"
firestore = "0.61"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "json", "chrono", "macros"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
governor = "0.10"
http-body = "1"
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
serde_json = "1"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
cookie = "0.18"
toml = "0.8"
moka = { version = "0.12", features = ["future"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
