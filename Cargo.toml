[workspace]
resolver = "2"
members = ["crates/common", "crates/data", "crates/web"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
thiserror = "2"
dotenvy = "0.15"
firestore = "0.61"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
